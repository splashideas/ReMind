name: dotnet-build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Azure Functions Core Tools
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-products.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-products.gpg] https://packages.microsoft.com/repos/microsoft-ubuntu-$(. /etc/os-release && echo $VERSION_CODENAME)-prod $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/dotnetdev.list
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4
      - name: Restore solution
        run: dotnet restore ReMind.sln
      - name: Build solution
        run: dotnet build ReMind.sln --no-restore -c Release
      - name: Install Playwright browser
        run: pwsh tests/ReMind.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Test solution
        run: dotnet test ReMind.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Install ReportGenerator
        if: ${{ !cancelled() }}
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Merge coverage reports
        if: ${{ !cancelled() }}
        run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:./TestResults/merged -reporttypes:Cobertura
      - name: Upload coverage artifact
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-csharp
          path: ./TestResults/merged/Cobertura.xml

  upload-coverage-csharp:
    needs: dotnet-build
    if: ${{ !cancelled() && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-csharp
      - uses: actions/upload-code-coverage@v1
        with:
          file: Cobertura.xml
          language: C#
          label: code-coverage-agent
